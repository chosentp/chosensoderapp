<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #219653;
        }

        .counter {
            text-align: right;
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .client-list {
            margin-top: 30px;
            max-height: 250px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .client-item {
            background: #fafafa;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Clientes</h2>
        
        <div class="form-group">
            <label for="clientName">Nombre del Cliente:</label>
            <input type="text" id="clientName" placeholder="Ingresá el nombre completo...">
            <div class="counter" id="counterText">Clientes cargados: 0 / 500</div>
        </div>

        <button onclick="agregarCliente()">Guardar Cliente</button>

        <div class="client-list" id="clientList">
            <!-- Acá se van a listar los clientes -->
        </div>
    </div>

    <script>
        // Array para guardar los clientes
        let clientes = [];
        const LIMITE_MAXIMO = 500; // Acá le podés poner 1000 si querés

        function agregarCliente() {
            const input = document.getElementById('clientName');
            const nombre = input.value.trim();

            // Validar que no esté vacío
            if (nombre === "") {
                alert("Che, por favor poné un nombre válido.");
                return;
            }

            // Validar el nuevo límite amplio (500 o el que definas)
            if (clientes.length >= LIMITE_MAXIMO) {
                alert(`¡Atención! Llegaste al límite máximo de ${LIMITE_MAXIMO} clientes.`);
                return;
            }

            // Agregamos el cliente al array
            clientes.push(nombre);
            
            // Limpiamos el input
            input.value = "";

            // Actualizamos la vista
            actualizarInterfaz();
        }

        function actualizarInterfaz() {
            const lista = document.getElementById('clientList');
            const counterText = document.getElementById('counterText');
            
            lista.innerHTML = "";
            
            clientes.forEach((cliente, index) => {
                const item = document.createElement('div');
                item.className = 'client-item';
                item.innerHTML = `<span><strong>#${index + 1}</strong> ${cliente}</span>`;
                lista.appendChild(item);
            });

            counterText.innerText = `Clientes cargados: ${clientes.length} / ${LIMITE_MAXIMO}`;
        }
    </script>
</body>
</html>
